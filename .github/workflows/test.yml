# Runs the smoke test (npm test) on every pull request and on every push to main.
name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    # (room for a slow Ubuntu mirror: the browser's system packages have taken over 10 minutes to download, which left
    # too little of 15 for the tests)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
